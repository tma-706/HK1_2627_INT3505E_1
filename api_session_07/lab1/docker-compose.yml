services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: appdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d appdb
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DB_URL: postgresql+psycopg://app:devpw@db:5432/appdb
      SECRET_KEY: docker-development-secret
      INSTANCE_PATH: /app/instance

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "5000:5000"

    restart: unless-stopped

volumes:
  postgres_data: